# Scoped style config for the hctsa Operations/*.m pass.
# Only enables rules for the specific conventions being standardized:
# comma spacing, comment spacing, operator spacing, and indentation
# consistency. Naming/copyright/complexity rules are left alone since
# they don't match (and we don't want to touch) hctsa's existing
# function/parameter naming or file header conventions.

suppress_rule: "naming_functions"
suppress_rule: "naming_parameters"
suppress_rule: "naming_scripts"
suppress_rule: "naming_classes"
suppress_rule: "naming_enumerations"
suppress_rule: "copyright_notice"
suppress_rule: "unicode"
suppress_rule: "line_length"
suppress_rule: "file_length"
suppress_rule: "redundant_brackets"
suppress_rule: "force_newlines"
suppress_rule: "whitespace_around_functions"
suppress_rule: "builtin_shadow"
suppress_rule: "implicit_shortcircuit"
suppress_rule: "dangerous_continuation"
suppress_rule: "useless_continuation"
suppress_rule: "operator_after_continuation"
suppress_rule: "spurious_row_comma"
suppress_rule: "spurious_row_semicolon"
suppress_rule: "whitespace_continuation"
suppress_rule: "end_of_statements"

# Top-level function bodies in this codebase are conventionally flush
# with the "function" line (only nested for/if/while/switch blocks are
# indented); MISS_HIT's default assumes an extra indent for the whole
# body, so that's turned off to avoid reindenting every file.
indent_function_file_body: false
tab_width: 4
